<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1270" viewBox="0 0 1080 1270" role="img" aria-labelledby="title desc">
<title id="title">手机触碰验证与服装资料页低保真原型</title>
<desc id="desc">六种状态：验证中、本次验证通过、自动更新与刷新查最新资料、直接访问、旧链接、服务故障。所有内容均为设计示例，自动更新与刷新查最新资料的产品目标已确认。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#243044} .small{font-size:13px;fill:#596579}.body{font-size:15px}.heading{font-size:19px;font-weight:700}.label{font-size:16px;font-weight:700}.line{stroke:#d4dbe5;fill:none}.box{fill:#fff;stroke:#bfc9d8}.tag{fill:#eaf4ee;stroke:#9ebaa8}.button{fill:#edf2f9;stroke:#8394ac}</style>
<rect width="1080" height="1270" fill="#f4f6f9"/>
<text x="30" y="35" class="heading">BUMBUM · 手机触碰验证与服装资料页</text>
<text x="30" y="59" class="small">低保真原型／示例资料，不连接真实接口。前台每60秒更新；不是已实现页面。</text>
<text x="30" y="98" class="label">01 · 验证中</text>
<rect x="30" y="110" width="320" height="530" rx="22" class="box"/>
<text x="50" y="140" class="label">BUMBUM</text>
<text x="50" y="167" class="small">nfc.bumbum.cc</text>
<path d="M48 183H332" class="line"/>
<rect x="50" y="275" width="280" height="108" rx="10" class="box"/>
<text x="72" y="315" class="heading">正在验证芯片…</text>
<text x="72" y="347" class="small">请稍候，无需再次点击。</text>
<text x="50" y="430" class="small">资料区域保持隐藏。</text>
<text x="50" y="454" class="small">不提前显示“验证通过”。</text>
<text x="50" y="478" class="small">同一次打开只提交一次验证。</text>
<text x="380" y="98" class="label">02 · 本次验证通过</text>
<rect x="380" y="110" width="320" height="530" rx="22" class="box"/>
<text x="400" y="140" class="label">BUMBUM</text>
<text x="400" y="167" class="small">nfc.bumbum.cc</text>
<path d="M398 183H682" class="line"/>
<rect x="400" y="200" width="280" height="65" rx="10" class="tag"/>
<text x="414" y="226" class="heading">✓ 芯片验证通过</text>
<text x="414" y="250" class="small">本次验证：10月27日 10:23</text>
<rect x="400" y="281" width="280" height="125" rx="10" class="box"/>
<text x="476" y="345" class="body">服装图片  1 / 3</text>
<text x="455" y="385" class="small">左右滑动 · 点击放大</text>
<text x="400" y="441" class="heading">棉质连帽外套（示例）</text>
<text x="400" y="469" class="small">编号：FASH-2026-000012</text>
<text x="400" y="501" class="body">材质  100% 棉</text>
<text x="400" y="532" class="body">介绍  简洁舒适的日常外套…</text>
<text x="400" y="563" class="body">洗护  轻柔机洗，避免高温烘干。</text>
<text x="400" y="604" class="small">前台自动更新 · 无需手动操作</text>
<text x="730" y="98" class="label">03 · 自动读取最新资料</text>
<rect x="730" y="110" width="320" height="530" rx="22" class="box"/>
<text x="750" y="140" class="label">BUMBUM</text>
<text x="750" y="167" class="small">nfc.bumbum.cc</text>
<path d="M748 183H1032" class="line"/>
<rect x="750" y="200" width="280" height="102" rx="10" class="box"/>
<text x="764" y="227" class="heading">最近芯片验证通过</text>
<text x="764" y="253" class="small">最近验证：10月27日 10:23</text>
<text x="764" y="279" class="small">资料及状态已查询：10月27日 10:31</text>
<rect x="750" y="320" width="280" height="110" rx="10" class="box"/>
<text x="826" y="382" class="body">最新资料中的图片</text>
<text x="750" y="465" class="heading">棉质连帽外套（示例）</text>
<text x="750" y="496" class="small">名称、图片、介绍按最新查询展示。</text>
<text x="750" y="527" class="small">自动更新不算新的芯片触碰。</text>
<text x="750" y="572" class="small">前台每60秒更新 · 切回立即更新</text>
<text x="750" y="596" class="small">后台暂停 · 更新失败时才提供重试</text>
<text x="750" y="620" class="small">停用后再次查询，停止展示资料。</text>
<text x="30" y="693" class="label">04 · 直接访问／没有查看资格</text>
<rect x="30" y="705" width="320" height="530" rx="22" class="box"/>
<text x="50" y="735" class="label">BUMBUM</text>
<text x="50" y="762" class="small">nfc.bumbum.cc</text>
<path d="M48 778H332" class="line"/>
<text x="58" y="886" class="heading">请触碰物品上的芯片</text>
<text x="58" y="923" class="body">将手机靠近 NFC 标签，</text>
<text x="58" y="951" class="body">点击系统通知打开资料页。</text>
<rect x="50" y="1005" width="280" height="42" rx="8" class="button"/>
<text x="64" y="1031" class="body">怎样触碰？</text>
<text x="50" y="1093" class="small">不提供编号搜索或绕过验证入口。</text>
<text x="380" y="693" class="label">05 · 旧链接／读数已使用</text>
<rect x="380" y="705" width="320" height="530" rx="22" class="box"/>
<text x="400" y="735" class="label">BUMBUM</text>
<text x="400" y="762" class="small">nfc.bumbum.cc</text>
<path d="M398 778H682" class="line"/>
<text x="408" y="886" class="heading">这次链接已使用</text>
<text x="408" y="923" class="body">请重新触碰实物，</text>
<text x="408" y="951" class="body">从新的系统通知进入。</text>
<rect x="400" y="1005" width="280" height="42" rx="8" class="button"/>
<text x="414" y="1031" class="body">怎样重新触碰？</text>
<text x="400" y="1093" class="small">不显示为假货，不自动重发读数。</text>
<text x="400" y="1119" class="small">新验证失败时不拿旧资料假装成功。</text>
<text x="730" y="693" class="label">06 · 验证结果未能确认</text>
<rect x="730" y="705" width="320" height="530" rx="22" class="box"/>
<text x="750" y="735" class="label">BUMBUM</text>
<text x="750" y="762" class="small">nfc.bumbum.cc</text>
<path d="M748 778H1032" class="line"/>
<text x="758" y="880" class="heading">暂时无法完成验证</text>
<text x="758" y="918" class="body">请检查网络，恢复后重新触碰。</text>
<text x="758" y="952" class="small">本次结果尚未确认。</text>
<rect x="750" y="1005" width="280" height="42" rx="8" class="button"/>
<text x="764" y="1031" class="body">怎样重新触碰？</text>
<text x="750" y="1093" class="small">不提供会自动重发的“再试一次”。</text>
<text x="750" y="1119" class="small">有错误编号时可复制编号反馈。</text>
</svg>