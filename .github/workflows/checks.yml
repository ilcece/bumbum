name: 项目检查
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_gateway:
        description: 额外构建镜像并运行TLS网关检查
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  basic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            frontend/admin/package-lock.json
            frontend/user/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend/admin
      - run: npm run build
        working-directory: frontend/admin
      - run: npm ci
        working-directory: frontend/user
      - run: npm run build
        working-directory: frontend/user
      - run: python scripts/check_docs.py
      - run: git diff --check
      - run: python -m pytest -m 'not auth_database and not browser and not integration' -q
  integration:
    needs: basic
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            frontend/admin/package-lock.json
            frontend/user/package-lock.json
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: frontend/admin
      - run: npm ci
        working-directory: frontend/user
      - run: docker pull mysql:8.0.46
      - run: python -m pytest --auth-db --browser --browser-artifacts test-results -q
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
  gateway:
    if: github.event_name == 'workflow_dispatch' && inputs.include_gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: docker build --secret id=proxy_ca,src=/etc/ssl/certs/ca-certificates.crt -f deploy/cloud_test/Dockerfile -t bumbum-ci:local .
      - run: python -m pytest tests/test_cloud_gateway.py tests/test_user_gateway.py --auth-db --cloud-image bumbum-ci:local -q
